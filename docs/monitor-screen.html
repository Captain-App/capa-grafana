<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitor Screen - Grafana Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    
    .dashboard-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    
    iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: calc(100% + 70px); /* Extend height */
      border: 0;
      pointer-events: auto;
      /* Crop the top 70px where controls are */
      clip-path: inset(70px 0 0 0);
      -webkit-clip-path: inset(70px 0 0 0);
      transform: translateY(-70px); /* Move up to hide top */
    }
  </style>
</head>
<body>
  <div class="dashboard-wrapper">
    <iframe
      id="dashboard-frame"
      src="https://capa.grafana.net/d/monitor-screen/monitor-screen?kiosk=1&refresh=30s&theme=dark&orgId=1"
      allowfullscreen
      frameborder="0"
      scrolling="no"
      sandbox="allow-same-origin allow-scripts allow-popups allow-forms"
    ></iframe>
  </div>
  
  <script>
    // Optional: Auto-refresh the page every 5 minutes
    setInterval(() => {
      window.location.reload();
    }, 5 * 60 * 1000);
  </script>
</body>
</html>
